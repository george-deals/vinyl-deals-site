name: Refresh blu-ray feed (hourly)

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-blu-ray
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh blu-ray
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TYPE="blu-ray"

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing: $TYPE"
          echo "BASE: $BASE"

          echo "Revalidating active $TYPE deals..."
          REVALIDATE_LIMIT=25
          REVALIDATE_TOTAL=300
          revalidate_offset=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="$BASE/api/refresh-$TYPE?token=$TOKEN&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}"
            echo "Revalidate offset=$revalidate_offset limit=$REVALIDATE_LIMIT"
            if ! curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time 45 \
              "$revalidate_url" | head -c 2000; then
              echo "WARNING: revalidation call failed; continuing to next chunk..."
            fi
            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          URL="$BASE/api/refresh-$TYPE?token=$TOKEN&maxPages=2&delayMs=0&moviesPerRun=25"
          echo "URL: $URL"

          for i in 1 2; do
            echo "Attempt $i..."
            set +e
            RESP=$(curl -sS --fail-with-body --max-time 180 "$URL")
            CODE=$?
            set -e

            if [ $CODE -eq 0 ]; then
              echo "$RESP"
              exit 0
            fi

            echo "curl failed (code=$CODE). Sleeping..."
            sleep $((10 * i))
          done

          echo "Failed after retries."
          exit 1
