name: Refresh 4k-uhd feed (hourly)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-4k-uhd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh 4k-uhd
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          TYPE="4k-uhd"

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing: $TYPE"
          echo "BASE: $BASE"

          echo "Revalidating active $TYPE deals..."
          REVALIDATE_LIMIT=25
          REVALIDATE_TOTAL=300
          revalidate_offset=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="$BASE/api/refresh-$TYPE?token=$TOKEN&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}"
            echo "Revalidate offset=$revalidate_offset limit=$REVALIDATE_LIMIT"
            if ! curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time 45 \
              "$revalidate_url" | head -c 2000; then
              echo "WARNING: revalidation call failed; continuing to next chunk..."
            fi
            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done
          PER_RUN=10
          TOTAL=40
          MAXPAGES=1
          BOOTSTRAP_LIMIT=80
          REQUEST_BUDGET_MS=70000
          fails=0
          offset=0

          while [ $offset -lt $TOTAL ]; do
            URL="$BASE/api/refresh-$TYPE?token=$TOKEN&maxPages=${MAXPAGES}&delayMs=0&moviesPerRun=${PER_RUN}&moviesOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=25000"
            echo "Chunk offset=$offset size=$PER_RUN"

            ok=0
            for i in 1 2; do
              echo "Attempt $i..."
              set +e
              RESP=$(curl -sS --fail-with-body --max-time 180 "$URL")
              CODE=$?
              set -e
              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                break
              fi
              echo "curl failed (code=$CODE). Sleeping..."
              sleep $((10 * i))
            done

            if [ $ok -eq 0 ]; then
              fails=$((fails + 1))
              echo "Chunk failed after retries (offset=$offset)."
            fi

            offset=$((offset + PER_RUN))
            sleep 2
          done

          if [ $fails -gt 0 ]; then
            echo "Completed with failures: $fails chunk(s) failed."
            exit 1
          fi

          echo "Done."
