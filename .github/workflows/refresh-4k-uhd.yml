name: Refresh 4k-uhd feed (hourly)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-4k-uhd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh 4k-uhd
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          TYPE="4k-uhd"

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing: $TYPE"
          echo "BASE: $BASE"
          echo "WORKFLOW_REV=4k-debug-v6"

          # Phase 1: bounded active revalidation (keeps stale prices from staying live)
          REVALIDATE_TOTAL=25
          REVALIDATE_LIMIT=25
          REVALIDATE_REQUEST_BUDGET_MS=26000
          REVALIDATE_CURL_MAX_TIME=45
          REVALIDATE_MAX_ATTEMPTS=1

          echo "Revalidating active $TYPE deals..."
          revalidate_offset=0
          revalidate_calls=0
          revalidate_success=0
          revalidate_failures=0

          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            RURL="$BASE/api/refresh-$TYPE?token=$TOKEN&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}&activeIncludeAll=1&requestBudgetMs=${REVALIDATE_REQUEST_BUDGET_MS}&maxPages=1&delayMs=0"
            echo "Revalidate offset=$revalidate_offset limit=$REVALIDATE_LIMIT"

            r_ok=0
            r_attempt=1
            while [ $r_attempt -le $REVALIDATE_MAX_ATTEMPTS ]; do
              echo "Revalidate attempt $r_attempt/$REVALIDATE_MAX_ATTEMPTS..."
              set +e
              RRESP=$(curl -sS --fail-with-body --connect-timeout 15 --max-time ${REVALIDATE_CURL_MAX_TIME} "$RURL")
              RCODE=$?
              set -e

              if [ $RCODE -eq 0 ]; then
                echo "$RRESP"
                r_ok=1
                break
              fi

              echo "Revalidate curl failed (code=$RCODE)."
              r_attempt=$((r_attempt + 1))
              sleep 2
            done

            revalidate_calls=$((revalidate_calls + 1))

            if [ $r_ok -eq 0 ]; then
              revalidate_failures=$((revalidate_failures + 1))
            else
              revalidate_success=$((revalidate_success + 1))

              attempted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.attempted_asins ?? 0));}catch{console.log(0);}})')
              updatedDiscounted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_discounted ?? 0));}catch{console.log(0);}})')
              updatedInvalid=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_invalid ?? 0));}catch{console.log(0);}})')

              echo "Revalidate attempted=${attempted} updated_discounted=${updatedDiscounted} updated_invalid=${updatedInvalid}"

              if [ "$attempted" -eq 0 ]; then
                echo "No more active rows to revalidate in this window."
                break
              fi
            fi

            if [ $revalidate_success -eq 0 ] && [ $revalidate_failures -ge 1 ]; then
              echo "Stopping revalidate early after repeated timeout/failure."
              break
            fi

            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 5
          done

          if [ $revalidate_calls -gt 0 ] && [ $revalidate_success -eq 0 ]; then
            echo "WARNING: all revalidate calls failed; continuing to discovery."
          fi

          # Phase 2: discovery loop
          PER_RUN=1
          TOTAL=12
          MAXPAGES=1
          BOOTSTRAP_LIMIT=10
          REQUEST_BUDGET_MS=18000
          BOOTSTRAP_RESERVE_MS=5000
          CURL_MAX_TIME=60
          MAX_ATTEMPTS=1

          fails=0
          successes=0
          chunks=0
          offset=0
          stop_discovery=0

          while [ $offset -lt $TOTAL ]; do
            URL="$BASE/api/refresh-$TYPE?token=$TOKEN&maxPages=${MAXPAGES}&delayMs=0&moviesPerRun=${PER_RUN}&moviesOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=${BOOTSTRAP_RESERVE_MS}&historyLookbackDays=365"
            echo "Chunk offset=$offset size=$PER_RUN"

            ok=0
            attempt=1
            while [ $attempt -le $MAX_ATTEMPTS ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS..."
              set +e
              RESP=$(curl -sS --fail-with-body --connect-timeout 15 --max-time ${CURL_MAX_TIME} "$URL")
              CODE=$?
              set -e

              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                break
              fi

              echo "curl failed (code=$CODE)."

              if [ -n "${RESP:-}" ] && echo "$RESP" | grep -q "degraded_no_live_pricing"; then
                echo "$RESP"
                echo "Detected degraded no-live-pricing state; stopping discovery with warning."
                ok=1
                stop_discovery=1
                break
              fi

              if [ -n "${RESP:-}" ] && echo "$RESP" | grep -q "AssociateNotEligible"; then
                echo "$RESP"
                echo "Detected AssociateNotEligible; stopping discovery with warning."
                ok=1
                stop_discovery=1
                break
              fi

              attempt=$((attempt + 1))
              sleep 2
            done

            chunks=$((chunks + 1))
            if [ $ok -eq 0 ]; then
              fails=$((fails + 1))
              echo "Chunk failed (offset=$offset)."
            else
              successes=$((successes + 1))
            fi

            if [ $stop_discovery -eq 1 ]; then
              break
            fi

            offset=$((offset + PER_RUN))
            sleep 5
          done

          if [ $successes -eq 0 ]; then
            echo "ERROR: all discovery chunks failed"
            exit 1
          fi

          if [ $fails -gt 0 ]; then
            echo "Completed with partial failures: $fails of $chunks chunk(s) failed."
          fi

          if [ $stop_discovery -eq 1 ]; then
            echo "Discovery stopped early due to degraded PA-API responses."
          fi

          echo "Done."
