name: Refresh 4k-uhd feed (hourly)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-4k-uhd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh 4k-uhd
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          TYPE="4k-uhd"

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing: $TYPE"
          echo "BASE: $BASE"

          echo "Revalidating active $TYPE deals..."
          REVALIDATE_LIMIT=40
          REVALIDATE_TOTAL=0
          revalidate_offset=0
          revalidate_calls=0
          revalidate_success=0

          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_calls=$((revalidate_calls + 1))
            revalidate_url="$BASE/api/refresh-$TYPE?token=$TOKEN&revalidateActive=1&revalidateOnly=1&activeIncludeAll=0&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}"
            echo "Revalidate offset=$revalidate_offset limit=$REVALIDATE_LIMIT"

            ok=0
            for i in 1 2; do
              set +e
              RESP=$(curl -sS --fail-with-body \
                --connect-timeout 20 \
                --max-time 120 \
                "$revalidate_url")
              CODE=$?
              set -e
              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                revalidate_success=$((revalidate_success + 1))
                break
              fi
              echo "Revalidate call failed (code=$CODE, attempt=$i). Sleeping..."
              sleep $((8 * i))
            done

            if [ $ok -eq 0 ]; then
              echo "WARNING: revalidate chunk failed (offset=$revalidate_offset)."
            fi

            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          if [ $REVALIDATE_TOTAL -gt 0 ] && [ $revalidate_success -eq 0 ]; then
            echo "WARNING: all 4k revalidate calls failed; continuing to discovery."
          fi

          PER_RUN=4
          TOTAL=60
          MAXPAGES=1
          BOOTSTRAP_LIMIT=120
          REQUEST_BUDGET_MS=50000
          fails=0
          successes=0
          chunks=0
          offset=0

          while [ $offset -lt $TOTAL ]; do
            URL="$BASE/api/refresh-$TYPE?token=$TOKEN&maxPages=${MAXPAGES}&delayMs=0&moviesPerRun=${PER_RUN}&moviesOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=15000&historyLookbackDays=365"
            echo "Chunk offset=$offset size=$PER_RUN"

            ok=0
            for i in 1 2; do
              echo "Attempt $i..."
              set +e
              RESP=$(curl -sS --fail-with-body --max-time 120 "$URL")
              CODE=$?
              set -e
              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                break
              fi
              echo "curl failed (code=$CODE). Sleeping..."
              sleep $((10 * i))
            done

            chunks=$((chunks + 1))
            if [ $ok -eq 0 ]; then
              fails=$((fails + 1))
              echo "Chunk failed after retries (offset=$offset)."
            else
              successes=$((successes + 1))
            fi

            offset=$((offset + PER_RUN))
            sleep 1
          done

          if [ $successes -eq 0 ]; then
            echo "ERROR: all discovery chunks failed"
            exit 1
          fi

          if [ $fails -gt 0 ]; then
            echo "Completed with partial failures: $fails of $chunks chunk(s) failed."
          fi

          echo "Done."
