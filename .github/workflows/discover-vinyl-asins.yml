name: Discover vinyl ASINs (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  discover-vinyl:
    runs-on: ubuntu-latest

    steps:
      - name: Call discover vinyl endpoint in small batches
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          BATCH=3

          for i in {0..20}; do
            OFFSET=$((i*BATCH))
            URL="$BASE/api/discover-vinyl-asins?token=$TOKEN&catalogPerRun=$BATCH&maxPages=1&delayMs=0"
            echo "Run $i URL: $URL"
            curl -sS "$URL"
            sleep 1
          done
