name: Refresh dvd feed (hourly)

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-dvd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh dvd
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          TYPE="dvd"

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          URL="$BASE/api/refresh-$TYPE?token=$TOKEN&maxPages=1&delayMs=1500&moviesPerRun=25"

          echo "Refreshing: $TYPE"
          echo "BASE: $BASE"
          echo "URL: $URL"

          for i in 1 2 3; do
            echo "Attempt $i..."
            set +e
            RESP=$(curl -sS --fail --max-time 240 "$URL")
            CODE=$?
            set -e
            if [ $CODE -eq 0 ]; then echo "$RESP"; exit 0; fi
            echo "curl failed (code=$CODE). Sleeping..."
            sleep $((10 * i))
          done

          echo "Failed after retries."
          exit 1
