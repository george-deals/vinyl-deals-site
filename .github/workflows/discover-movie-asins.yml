name: Discover movie ASINs (hourly)

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  discover-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Call discover movie endpoint in small batches
        run: |
          BASE="https://YOURDOMAIN.com"
          TOKEN="${{ secrets.REFRESH_TOKEN }}"
          BATCH=3

          for i in {0..20}; do
            OFFSET=$((i*BATCH))
            URL="$BASE/api/discover-movie-asins?token=$TOKEN&moviesPerRun=$BATCH&maxPages=1&delayMs=0"
            echo "Run $i URL: $URL"
            curl -sS "$URL"
            sleep 1
          done
