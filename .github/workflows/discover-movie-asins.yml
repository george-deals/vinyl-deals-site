name: Discover movie ASINs (hourly)

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  discover-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Discover movie ASINs by media type
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          for TYPE in 4k-uhd blu-ray dvd; do
            URL="$BASE/api/discover-movie-asins?token=$TOKEN&media_type=${TYPE}&moviesPerRun=120&maxPages=1&delayMs=0"
            echo "Discover URL ($TYPE): $URL"
            curl -sS --fail --max-time 240 "$URL"
            sleep 2
          done
