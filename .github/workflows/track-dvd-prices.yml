name: Track DVD prices (4x daily)

on:
  schedule:
    - cron: "25 2,8,14,20 * * *"
  workflow_dispatch:

concurrency:
  group: track-dvd-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Track DVD prices (4x daily)
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then BASE="https://www.mediadealshub.com"; fi

          URL="$BASE/api/track-prices?token=$TOKEN&media_type=dvd&batchSize=80&delayMs=300"

          echo "URL: $URL"
          curl -sS --fail --max-time 240 "$URL"
