name: Refresh vinyl feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-vinyl-main
      cancel-in-progress: true
    steps:
      - name: Refresh vinyl (discount deals) — chunked calls with backoff
        env:
          BASE: ${{ secrets.REFRESH_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          PER_RUN=10
          HOT_PER_RUN=20
          MAXPAGES=1
          DELAYMS=0
          MIN_DISCOUNT=15
          BOOTSTRAP_LIMIT=80
          REQUEST_BUDGET_MS=70000
          TOTAL=100
          SLEEP_BETWEEN_CHUNKS=1

          if [ -z "${BASE:-}" ]; then
            echo "ERROR: REFRESH_BASE_URL secret is empty"
            exit 1
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "ERROR: REFRESH_TOKEN secret is empty"
            exit 1
          fi

          echo "BASE: ${BASE}"
          echo "Refreshing vinyl deals in chunks..."

          echo "Revalidating active vinyl deals..."
          REVALIDATE_LIMIT=50
          REVALIDATE_TOTAL=1200
          REVALIDATE_REQUEST_BUDGET_MS=26000
          REVALIDATE_CURL_MAX_TIME=45
          revalidate_offset=0
          revalidate_calls=0
          revalidate_success=0
          revalidate_failures=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="${BASE}/api/refresh-vinyl?token=${TOKEN}&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}&activeIncludeAll=1&requestBudgetMs=${REVALIDATE_REQUEST_BUDGET_MS}&maxPages=1&delayMs=0&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"
            echo "Revalidate offset=${revalidate_offset} limit=${REVALIDATE_LIMIT}"

            set +e
            RRESP=$(curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time ${REVALIDATE_CURL_MAX_TIME} \
              "$revalidate_url")
            RCODE=$?
            set -e

            revalidate_calls=$((revalidate_calls + 1))

            if [ $RCODE -ne 0 ]; then
              revalidate_failures=$((revalidate_failures + 1))
              echo "WARNING: revalidation call failed (code=$RCODE); continuing..."
            else
              revalidate_success=$((revalidate_success + 1))
              echo "${RRESP:0:2000}"

              attempted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.attempted_asins ?? 0));}catch{console.log(0);}})')
              updatedDiscounted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_discounted ?? 0));}catch{console.log(0);}})')
              updatedInvalid=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_invalid ?? 0));}catch{console.log(0);}})')

              echo "Revalidate attempted=${attempted} updated_discounted=${updatedDiscounted} updated_invalid=${updatedInvalid}"
              if [ "$attempted" -eq 0 ]; then
                echo "No more active rows to revalidate in this window."
                break
              fi
            fi

            if [ $revalidate_success -eq 0 ] && [ $revalidate_failures -ge 2 ]; then
              echo "Stopping revalidation early after repeated failures."
              break
            fi

            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          if [ $revalidate_calls -gt 0 ] && [ $revalidate_success -eq 0 ]; then
            echo "WARNING: all revalidate calls failed; continuing to discovery."
          fi

          offset=0
          while [ $offset -lt $TOTAL ]; do
            echo "Chunk offset=$offset size=$PER_RUN"
            url="${BASE}/api/refresh-vinyl?token=${TOKEN}&min_discount=${MIN_DISCOUNT}&maxPages=${MAXPAGES}&delayMs=${DELAYMS}&hotPerRun=${HOT_PER_RUN}&catalogPerRun=${PER_RUN}&catalogOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=25000&historyLookbackDays=365&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"

            attempt=1
            max_attempts=2
            ok=0

            while [ $attempt -le $max_attempts ]; do
              echo "Request attempt $attempt/$max_attempts..."
              if curl -sS --fail-with-body \
                --connect-timeout 20 \
                --max-time 180 \
                "$url" | head -c 2000; then
                ok=1
                break
              fi

              echo "Request failed (attempt $attempt). Sleeping before retry..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done

            if [ $ok -ne 1 ]; then
              echo "WARNING: chunk failed after $max_attempts attempts (offset=$offset). Continuing..."
            fi

            offset=$((offset + PER_RUN))
            sleep "${SLEEP_BETWEEN_CHUNKS}"
          done

          echo "Done."
