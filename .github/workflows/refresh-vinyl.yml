name: Refresh vinyl feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-vinyl-main
      cancel-in-progress: true
    steps:
      - name: Refresh vinyl (discount deals) — chunked calls with backoff
        env:
          BASE: ${{ secrets.REFRESH_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          PER_RUN=10
          HOT_PER_RUN=20
          MAXPAGES=1
          DELAYMS=0
          MIN_DISCOUNT=15
          BOOTSTRAP_LIMIT=80
          REQUEST_BUDGET_MS=70000
          TOTAL=100
          SLEEP_BETWEEN_CHUNKS=1

          if [ -z "${BASE:-}" ]; then
            echo "ERROR: REFRESH_BASE_URL secret is empty"
            exit 1
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "ERROR: REFRESH_TOKEN secret is empty"
            exit 1
          fi

          echo "BASE: ${BASE}"
          echo "Refreshing vinyl deals in chunks..."

          echo "Revalidating active vinyl deals..."
          REVALIDATE_LIMIT=25
          REVALIDATE_TOTAL=300
          REVALIDATE_REQUEST_BUDGET_MS=26000
          revalidate_offset=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="${BASE}/api/refresh-vinyl?token=${TOKEN}&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}&activeIncludeAll=1&requestBudgetMs=${REVALIDATE_REQUEST_BUDGET_MS}&maxPages=1&delayMs=0&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"
            echo "Revalidate offset=${revalidate_offset} limit=${REVALIDATE_LIMIT}"
            if ! curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time 45 \
              "$revalidate_url" | head -c 2000; then
              echo "WARNING: revalidation call failed; continuing to next chunk..."
            fi
            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          offset=0
          while [ $offset -lt $TOTAL ]; do
            echo "Chunk offset=$offset size=$PER_RUN"
            url="${BASE}/api/refresh-vinyl?token=${TOKEN}&min_discount=${MIN_DISCOUNT}&maxPages=${MAXPAGES}&delayMs=${DELAYMS}&hotPerRun=${HOT_PER_RUN}&catalogPerRun=${PER_RUN}&catalogOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=25000&historyLookbackDays=365&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"

            attempt=1
            max_attempts=2
            ok=0

            while [ $attempt -le $max_attempts ]; do
              echo "Request attempt $attempt/$max_attempts..."
              if curl -sS --fail-with-body \
                --connect-timeout 20 \
                --max-time 180 \
                "$url" | head -c 2000; then
                ok=1
                break
              fi

              echo "Request failed (attempt $attempt). Sleeping before retry..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done

            if [ $ok -ne 1 ]; then
              echo "WARNING: chunk failed after $max_attempts attempts (offset=$offset). Continuing..."
            fi

            offset=$((offset + PER_RUN))
            sleep "${SLEEP_BETWEEN_CHUNKS}"
          done

          echo "Done."
