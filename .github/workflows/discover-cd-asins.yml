name: Discover CD ASINs (hourly)

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

concurrency:
  group: discover-cd-asins
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover CD ASINs (hourly)
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          BASE="$(echo "${BASE_URL:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then BASE="https://www.mediadealshub.com"; fi

          URL="$BASE/api/discover-cd-asins?token=$TOKEN&maxPages=1&delayMs=0&catalogPerRun=20&requestBudgetMs=120000"

          echo "URL: $URL"

          ok=0
          for attempt in 1 2; do
            set +e
            RESP=$(curl -sS --fail-with-body --max-time 200 "$URL")
            CODE=$?
            set -e

            if [ $CODE -eq 0 ]; then
              echo "$RESP"
              ok=1
              break
            fi

            echo "discover-cd failed (attempt $attempt, code=$CODE)."
            sleep $((attempt * 8))
          done

          if [ $ok -ne 1 ]; then
            echo "discover-cd failed after retries"
            exit 1
          fi
