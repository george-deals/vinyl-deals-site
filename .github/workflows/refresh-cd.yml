name: Refresh cd feed (full catalog per run)

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-cd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Refresh cd (discount deals) — chunked calls with backoff
        env:
          BASE: ${{ secrets.REFRESH_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          PER_RUN=10
          HOT_PER_RUN=10
          MAXPAGES=1
          DELAYMS=0
          MIN_DISCOUNT=15

          TOTAL=60

          CURL_MAX_TIME=180
          CURL_RETRY_DELAY=10

          BASE="$(echo "${BASE:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing cd deals in chunks..."
          echo "BASE: ${BASE}"

          echo "Revalidating active cd deals..."
          REVALIDATE_LIMIT=25
          REVALIDATE_TOTAL=300
          revalidate_offset=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="${BASE}/api/refresh-cd?token=${TOKEN}&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}"
            echo "Revalidate offset=${revalidate_offset} limit=${REVALIDATE_LIMIT}"
            if ! curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time 45 \
              "$revalidate_url" | head -c 2000; then
              echo "WARNING: revalidation call failed; continuing..."
            fi
            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          fails=0
          offset=0

          while [ $offset -lt $TOTAL ]; do
            echo "Chunk offset=$offset size=$PER_RUN"

            URL="${BASE}/api/refresh-cd?token=${TOKEN}&min_discount=${MIN_DISCOUNT}&maxPages=${MAXPAGES}&delayMs=${DELAYMS}&hotPerRun=${HOT_PER_RUN}&catalogPerRun=${PER_RUN}&catalogOffset=${offset}"

            ok=0
            for i in 1 2; do
              set +e
              RESP=$(curl -sS --fail --max-time "$CURL_MAX_TIME" "$URL" | head -c 2000)
              CODE=$?
              set -e
              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                break
              fi
              echo "curl failed (code=$CODE). Sleeping..."
              sleep $((CURL_RETRY_DELAY * i))
            done

            if [ $ok -eq 0 ]; then
              fails=$((fails + 1))
              echo "Chunk failed after retries (offset=$offset)."
            fi

            offset=$((offset + PER_RUN))
            sleep 2
          done

          if [ $fails -gt 0 ]; then
            echo "Completed with failures: $fails chunk(s) failed."
            exit 1
          fi

          echo "Done."
