name: Refresh cd feed (full catalog per run)

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-cd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Refresh cd (discount deals) — chunked calls with backoff
        env:
          BASE: ${{ secrets.REFRESH_BASE_URL }}
          TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          PER_RUN=10
          HOT_PER_RUN=10
          MAXPAGES=1
          DELAYMS=0
          MIN_DISCOUNT=15
          BOOTSTRAP_LIMIT=80
          REQUEST_BUDGET_MS=70000

          TOTAL=60

          CURL_MAX_TIME=180
          CURL_RETRY_DELAY=10

          BASE="$(echo "${BASE:-}" | tr -d '\r\n' | xargs)"
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            BASE="https://www.mediadealshub.com"
          fi

          echo "Refreshing cd deals in chunks..."
          echo "BASE: ${BASE}"

          echo "Revalidating active cd deals..."
          REVALIDATE_LIMIT=50
          REVALIDATE_TOTAL=1200
          REVALIDATE_REQUEST_BUDGET_MS=26000
          REVALIDATE_CURL_MAX_TIME=45
          revalidate_offset=0
          revalidate_calls=0
          revalidate_success=0
          revalidate_failures=0
          while [ $revalidate_offset -lt $REVALIDATE_TOTAL ]; do
            revalidate_url="${BASE}/api/refresh-cd?token=${TOKEN}&revalidateActive=1&revalidateOnly=1&activeLimit=${REVALIDATE_LIMIT}&activeOffset=${revalidate_offset}&activeIncludeAll=1&requestBudgetMs=${REVALIDATE_REQUEST_BUDGET_MS}&maxPages=1&delayMs=0&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"
            echo "Revalidate offset=${revalidate_offset} limit=${REVALIDATE_LIMIT}"

            set +e
            RRESP=$(curl -sS --fail-with-body \
              --connect-timeout 20 \
              --max-time ${REVALIDATE_CURL_MAX_TIME} \
              "$revalidate_url")
            RCODE=$?
            set -e

            revalidate_calls=$((revalidate_calls + 1))

            if [ $RCODE -ne 0 ]; then
              revalidate_failures=$((revalidate_failures + 1))
              echo "WARNING: revalidation call failed (code=$RCODE); continuing..."
            else
              revalidate_success=$((revalidate_success + 1))
              echo "${RRESP:0:2000}"

              attempted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.attempted_asins ?? 0));}catch{console.log(0);}})')
              updatedDiscounted=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_discounted ?? 0));}catch{console.log(0);}})')
              updatedInvalid=$(echo "$RRESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(Number(j?.revalidate_active?.updated_invalid ?? 0));}catch{console.log(0);}})')

              echo "Revalidate attempted=${attempted} updated_discounted=${updatedDiscounted} updated_invalid=${updatedInvalid}"
              if [ "$attempted" -eq 0 ]; then
                echo "No more active rows to revalidate in this window."
                break
              fi
            fi

            if [ $revalidate_success -eq 0 ] && [ $revalidate_failures -ge 2 ]; then
              echo "Stopping revalidation early after repeated failures."
              break
            fi

            revalidate_offset=$((revalidate_offset + REVALIDATE_LIMIT))
            sleep 1
          done

          if [ $revalidate_calls -gt 0 ] && [ $revalidate_success -eq 0 ]; then
            echo "WARNING: all revalidate calls failed; continuing..."
          fi

          fails=0
          offset=0

          while [ $offset -lt $TOTAL ]; do
            echo "Chunk offset=$offset size=$PER_RUN"

            URL="${BASE}/api/refresh-cd?token=${TOKEN}&min_discount=${MIN_DISCOUNT}&maxPages=${MAXPAGES}&delayMs=${DELAYMS}&hotPerRun=${HOT_PER_RUN}&catalogPerRun=${PER_RUN}&catalogOffset=${offset}&bootstrapLimit=${BOOTSTRAP_LIMIT}&requestBudgetMs=${REQUEST_BUDGET_MS}&bootstrapReserveMs=25000&historyLookbackDays=365&degradedAsWarning=1&strictLivePricing=1&stalePruneHours=0"

            ok=0
            for i in 1 2; do
              set +e
              RESP=$(curl -sS --fail --max-time "$CURL_MAX_TIME" "$URL" | head -c 2000)
              CODE=$?
              set -e
              if [ $CODE -eq 0 ]; then
                echo "$RESP"
                ok=1
                break
              fi
              echo "curl failed (code=$CODE). Sleeping..."
              sleep $((CURL_RETRY_DELAY * i))
            done

            if [ $ok -eq 0 ]; then
              fails=$((fails + 1))
              echo "Chunk failed after retries (offset=$offset)."
            fi

            offset=$((offset + PER_RUN))
            sleep 2
          done

          if [ $fails -gt 0 ]; then
            echo "Completed with failures: $fails chunk(s) failed."
            exit 1
          fi

          echo "Done."
